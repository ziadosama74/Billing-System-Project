<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Subscribers | Billing System</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="/Billing-System-Web-GUI/CSS/subscribers.css">
    </head>
    <body class="theme">

        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <i class="fa-solid fa-tower-cell"></i>
                    <span>Postpaid Billing System</span>
                </div>
                <div class="nav-links">
                    <a href="/Billing-System-Web-GUI/SubscribersMainPageServlet" class="nav-link active">
                        <i class="fas fa-users"></i> Subscribers
                    </a>
                    <a href="/Billing-System-Web-GUI/HTML/plans.html" class="nav-link">
                        <i class="fas fa-layer-group"></i> Plans
                    </a>
                    <a href="/Billing-System-Web-GUI/HTML/bills.html" class="nav-link">
                        <i class="fas fa-file-invoice-dollar"></i> Invoices
                    </a>
                    <a href="/Billing-System-Web-GUI/HTML/CDR.html" class="nav-link">
                        <i class="fas fa-file-arrow-up"></i> Upload CDR
                    </a>
                </div>
                <a href="/Billing-System-Web-GUI/HTML/dashboard.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
            </div>
        </nav>

        <div class="container">
            <div class="header">
                <div class="title-section">
                    <div class="title-left">
                        <div class="title-visual">
                            <img src="/Billing-System-Web-GUI/images/users.gif" alt="Users Animation">
                        </div>
                        <div class="title-text">
                            <h1>Subscribers</h1>
                            <p>Control, search and manage all subscribers in your billing system</p>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <!-- SEARCH -->
                    <form action="/Billing-System-Web-GUI/SubscribersMainPageServlet" method="get" class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" name="MSISDN" placeholder="Search MSISDN">
                        <button type="submit" style="display: none;"></button>
                    </form>

                    <!-- ACTION BUTTONS -->
                    <form action="/Billing-System-Web-GUI/SubscribersMainPageServlet" method="get">
                        <button type="submit" class="btn all-btn">
                            <i class="fa-solid fa-list"></i> All
                        </button>
                    </form>

                    <a href="/Billing-System-Web-GUI/GetAllPlanServlet" class="btn add-btn">
                        <i class="fa-solid fa-user-plus"></i> Add
                    </a>
                </div>
            </div>

            <!-- TABLE CARD -->
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Subscriber</th>
                            <th>MSISDN</th>
                            <th>Address</th>
                            <th>International ID</th>
                            <th>Plan</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
