<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bills | Billing System</title>

        <!-- ICONS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        <!-- CSS -->
        <link rel="stylesheet" href="../CSS/bills.css">
    </head>

    <body class="theme">

        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <i class="fa-solid fa-tower-cell"></i>
                    <span>Postpaid Billing System</span>
                </div>
                <div class="nav-links">
                    <a href="/Billing-System-Web-GUI/SubscribersMainPageServlet" class="nav-link">
                        <i class="fas fa-users"></i> Subscribers
                    </a>
                    <a href="/Billing-System-Web-GUI/HTML/plans.html" class="nav-link">
                        <i class="fas fa-layer-group"></i> Plans
                    </a>
                    <a href="/Billing-System-Web-GUI/HTML/Invoices.jsp" class="nav-link active">
                        <i class="fas fa-file-invoice-dollar"></i> Invoices
                    </a>
                    <a href="/Billing-System-Web-GUI/HTML/CDR.html" class="nav-link">
                        <i class="fas fa-file-arrow-up"></i> Upload CDR
                    </a>
                </div>
                <a href="/Billing-System-Web-GUI/HTML/dashboard.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
            </div>
        </nav>

        <div class="container">
            <!-- HEADER SECTION -->
            <div class="header">
                <div class="header-left">
                    <div class="title-icon">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                    </div>
                    <div class="title-text">
                        <h1>Invoices</h1>
                        <p>View and manage customer invoices</p>
                    </div>
                </div>
                <div class="header-right">
                    <img src="../images/money.gif" class="header-gif" alt="money" id="moneyGif">
                </div>
            </div>

            <!-- SEARCH SECTION -->
            <div class="search-wrapper">
                <form id="searchForm" action="SearchBill" method="get" class="search-bar">
                    <div class="field">
                        <label><i class="fa-solid fa-phone"></i> MSISDN (Phone Number)</label>
                        <div class="input-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" name="msisdn" placeholder="Enter 11-digit phone number e.g., 01126165494">
                        </div>
                    </div>

                    <div class="field">
                        <label><i class="fa-solid fa-calendar"></i> Bill Month</label>
                        <div class="input-box">
                            <i class="fa-solid fa-calendar-alt"></i>
                            <select name="month" id="monthSelect">
                                <option value="">All Months</option>
                            </select>
                        </div>
                    </div>

                    <div class="field btn-field">
                        <button type="submit" class="search-btn">
                            <i class="fa-solid fa-search"></i> Search Invoices
                        </button>
                    </div>
                </form>
            </div>

            <!-- RESULTS SUMMARY -->
            <div class="results-summary" id="resultsSummary">
                <div class="summary-card">
                    <i class="fa-solid fa-file-invoice"></i>
                    <div class="summary-info">
                        <span class="summary-label">Total Invoices</span>
                        <span class="summary-value" id="totalInvoices">0</span>
                    </div>
                </div>
                <div class="summary-card">
                    <i class="fa-solid fa-dollar-sign"></i>
                    <div class="summary-info">
                        <span class="summary-label">Total Amount</span>
                        <span class="summary-value" id="totalAmount">EGP 0</span>
                    </div>
                </div>
            </div>

            <!-- INVOICES TABLE -->
            <div class="table-card">
                <div class="table-header">
                    <h3><i class="fa-solid fa-list"></i> Invoice List</h3>
                </div>

                <div class="table-wrapper">
                    <table id="invoicesTable">
                        <thead>
                            <tr>
                                <th>Invoice ID</th>
                                <th>Subscriber Name</th>
                                <th>MSISDN</th>
                                <th>Bill Month</th>
                                <th>Due Date</th>
                                <th>Amount (EGP)</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="invoicesTableBody">
                            <!-- Dynamic content will be loaded here -->
                            <tr class="loading-row">
                                <td colspan="7">
                                    <div class="loading-spinner">
                                        <i class="fa-solid fa-spinner fa-spin"></i> Loading invoices...
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VIEW INVOICE MODAL -->
        <div id="invoiceModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2><i class="fa-solid fa-file-invoice"></i> Invoice Details</h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body" id="invoiceModalBody">
                    <!-- Dynamic invoice details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button class="btn-print" onclick="printInvoice()">
                        <i class="fa-solid fa-print"></i> Print Invoice
                    </button>
                    <button class="btn-close" id="closeModalBtn">Close</button>
                </div>
            </div>
        </div>

        <script src="../JS/bills.js"></script>
    </body>
</html>
