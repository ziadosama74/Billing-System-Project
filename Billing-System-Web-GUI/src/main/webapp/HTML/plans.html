<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Postpaid Billing System - Plans Management</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="../CSS/plans.css">
    </head>
    <body class="theme">
        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <i class="fa-solid fa-tower-cell"></i>
                    <span>Postpaid Billing System</span>
                </div>
                <div class="nav-links">
                    <a href="/Billing-System-Web-GUI/SubscribersMainPageServlet" class="nav-link">
                        <i class="fas fa-users"></i> Subscribers
                    </a>
                    <a href="/Billing-System-Web-GUI/HTML/plans.html" class="nav-link active">
                        <i class="fas fa-layer-group"></i> Plans
                    </a>
                    <a href="/Billing-System-Web-GUI/HTML/bills.html" class="nav-link">
                        <i class="fas fa-file-invoice-dollar"></i> Invoices
                    </a>
                    <a href="/Billing-System-Web-GUI/HTML/CDR.html" class="nav-link">
                        <i class="fas fa-file-arrow-up"></i> Upload CDR
                    </a>
                </div>
                <a href="/Billing-System-Web-GUI/HTML/dashboard.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
            </div>
        </nav>

        <div class="container">
            <div class="header">
                <h1><i class="fas fa-layer-group"></i> Plans</h1>
                <button class="btn-add" id="openAddModalBtn" type="button">
                    <i class="fas fa-plus"></i> Add New Plan
                </button>
            </div>

            <!-- Plans Cards Container -->
            <div class="plans-container" id="plansContainer">
                <div class="loading">Loading plans...</div>
            </div>
        </div>

        <!-- ========== ADD/EDIT PLAN MODAL ========== -->
        <div id="planModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Add New Plan</h2>
                    <span class="close">&times;</span>
                </div>
                <form id="planForm" novalidate>
                    <input type="hidden" id="planId" value="">

                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> Plan Name <span class="required-star">*</span></label>
                        <input type="text" id="planName" placeholder="e.g., Basic, Standard, Premium">
                        <div class="error-message" id="planNameError"></div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-palette"></i> Color (Hex) <span class="required-star">*</span></label>
                        <input type="color" id="planColor" value="#38bdf8">
                        <div class="error-message" id="planColorError"></div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-dollar-sign"></i> Monthly Fee (EGP) <span class="required-star">*</span></label>
                        <input type="number" id="monthlyFee" placeholder="75">
                        <div class="error-message" id="monthlyFeeError"></div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label><i class="fas fa-phone"></i> Voice Minutes <span class="required-star">*</span></label>
                            <input type="number" id="minutes" placeholder="e.g., 300">
                            <div class="error-message" id="minutesError"></div>
                        </div>
                        <div class="form-group half">
                            <label><i class="fas fa-gift"></i> Free Minutes <span class="required-star">*</span></label>
                            <input type="number" id="voiceFree" placeholder="e.g., 20">
                            <div class="error-message" id="voiceFreeError"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label><i class="fas fa-wifi"></i> Data (MB) <span class="required-star">*</span></label>
                            <input type="number" id="data" placeholder="e.g., 10240">
                            <div class="error-message" id="dataError"></div>
                        </div>
                        <div class="form-group half">
                            <label><i class="fas fa-gift"></i> Free Data (MB) <span class="required-star">*</span></label>
                            <input type="number" id="dataFree" placeholder="e.g., 1024">
                            <div class="error-message" id="dataFreeError"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label><i class="fas fa-envelope"></i> SMS <span class="required-star">*</span></label>
                            <input type="number" id="sms" placeholder="e.g., 50">
                            <div class="error-message" id="smsError"></div>
                        </div>
                        <div class="form-group half">
                            <label><i class="fas fa-gift"></i> Free SMS <span class="required-star">*</span></label>
                            <input type="number" id="smsFree" placeholder="e.g., 10">
                            <div class="error-message" id="smsFreeError"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-align-left"></i> Description <span class="required-star">*</span></label>
                        <textarea id="description" rows="3" placeholder="e.g., Light users, Regular users..."></textarea>
                        <div class="error-message" id="descriptionError"></div>
                    </div>

                    <div class="form-buttons">
                        <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
                        <button type="submit" class="btn-save">Save Plan</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="../JS/plans.js"></script>
    </body>
</html>
