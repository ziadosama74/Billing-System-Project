<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Error - Plan Status Update Failed</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                min-height: 100vh;
                background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow-x: hidden;
            }

            /* Animated background glow */
            body::before {
                content: "";
                position: fixed;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle, rgba(239, 68, 68, 0.15), transparent 60%);
                animation: moveBg 15s linear infinite;
                z-index: -1;
                top: -25%;
                left: -25%;
            }

            @keyframes moveBg {
                0% {
                    transform: translate(0, 0);
                }
                50% {
                    transform: translate(-25%, -25%);
                }
                100% {
                    transform: translate(0, 0);
                }
            }

            /* Error Card */
            .error-card {
                background: rgba(15, 23, 42, 0.85);
                backdrop-filter: blur(20px);
                border-radius: 28px;
                padding: 50px 40px;
                text-align: center;
                max-width: 550px;
                width: 90%;
                border: 1px solid rgba(239, 68, 68, 0.4);
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(239, 68, 68, 0.2);
                animation: slideIn 0.5s ease-out;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(50px) scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            /* Icon */
            .icon-circle {
                width: 110px;
                height: 110px;
                background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.05));
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 0 auto 25px;
                border: 2px solid rgba(239, 68, 68, 0.6);
                animation: shakeIcon 0.6s ease-out;
            }

            @keyframes shakeIcon {
                0%, 100% {
                    transform: scale(1);
                }
                10%, 30%, 50%, 70%, 90% {
                    transform: rotate(-5deg) scale(1.05);
                }
                20%, 40%, 60%, 80% {
                    transform: rotate(5deg) scale(1.05);
                }
            }

            .icon-circle i {
                font-size: 55px;
                color: #ef4444;
            }

            /* Title */
            h1 {
                font-size: 2.2rem;
                color: #ef4444;
                margin-bottom: 15px;
                font-weight: 800;
                letter-spacing: -0.5px;
            }

            /* Message */
            .message {
                color: #cbd5e1;
                font-size: 1rem;
                line-height: 1.6;
                margin-bottom: 20px;
            }

            .error-details {
                background: rgba(239, 68, 68, 0.1);
                border-left: 3px solid #ef4444;
                padding: 15px;
                border-radius: 10px;
                margin-bottom: 25px;
                text-align: left;
            }

            .error-details p {
                color: #f87171;
                font-size: 0.85rem;
                margin: 8px 0;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .error-details i {
                width: 20px;
                color: #ef4444;
            }

            /* Error Code Box */
            .error-code {
                background: rgba(0, 0, 0, 0.4);
                padding: 12px;
                border-radius: 8px;
                font-family: monospace;
                font-size: 0.8rem;
                color: #ef4444;
                margin-bottom: 25px;
                border: 1px solid rgba(239, 68, 68, 0.3);
            }

            /* Buttons */
            .buttons {
                display: flex;
                gap: 15px;
                justify-content: center;
                flex-wrap: wrap;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                color: white;
                text-decoration: none;
                padding: 12px 28px;
                border-radius: 12px;
                font-weight: 600;
                font-size: 0.95rem;
                transition: all 0.3s ease;
                border: none;
                cursor: pointer;
            }

            .btn-primary {
                background: linear-gradient(135deg, #ef4444, #dc2626);
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
            }

            .btn-secondary {
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.2);
                transform: translateY(-2px);
            }

            /* Support Links */
            .support-links {
                margin-top: 25px;
                padding-top: 20px;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }

            .support-links a {
                color: #94a3b8;
                text-decoration: none;
                font-size: 0.85rem;
                margin: 0 10px;
                transition: color 0.3s ease;
            }

            .support-links a:hover {
                color: #38bdf8;
            }

            /* Responsive */
            @media (max-width: 600px) {
                .error-card {
                    padding: 35px 25px;
                }

                h1 {
                    font-size: 1.8rem;
                }

                .icon-circle {
                    width: 80px;
                    height: 80px;
                }

                .icon-circle i {
                    font-size: 40px;
                }

                .btn {
                    padding: 10px 20px;
                    font-size: 0.85rem;
                }
            }
        </style>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <div class="error-card">
            <div class="icon-circle">
                <i class="fas fa-exclamation-triangle"></i>
            </div>

            <h1>Status Update Failed!</h1>

            <div class="message">
                We couldn't update the plan status. The operation was not completed successfully.
            </div>

            <div class="error-code" id="errorMessage">
                <i class="fas fa-code"></i> Error: Plan status could not be changed
            </div>

            <div class="buttons">
                <a href="/Billing-System-Web-GUI/OpenPlansPageServelt" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Go Back & Try Again
                </a>
                <a href="/Billing-System-Web-GUI/OpenPlansPageServelt" class="btn btn-secondary">
                    <i class="fas fa-layer-group"></i> View All Plans
                </a>
                <a href="/Billing-System-Web-GUI/HTML/dashboard.html" class="btn btn-secondary">
                    <i class="fas fa-home"></i> Dashboard
                </a>
            </div>
        </div>
    </body>
</html>
