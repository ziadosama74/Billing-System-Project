<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Success - Plan Updated</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                min-height: 100vh;
                background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow-x: hidden;
            }

            /* Animated background glow */
            body::before {
                content: "";
                position: fixed;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle, rgba(34, 197, 94, 0.15), transparent 60%);
                animation: moveBg 15s linear infinite;
                z-index: -1;
                top: -25%;
                left: -25%;
            }

            @keyframes moveBg {
                0% {
                    transform: translate(0, 0);
                }
                50% {
                    transform: translate(-25%, -25%);
                }
                100% {
                    transform: translate(0, 0);
                }
            }

            /* Success Card */
            .success-card {
                background: rgba(15, 23, 42, 0.8);
                backdrop-filter: blur(20px);
                border-radius: 24px;
                padding: 50px 40px;
                text-align: center;
                max-width: 500px;
                width: 90%;
                border: 1px solid rgba(34, 197, 94, 0.3);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(34, 197, 94, 0.2);
                animation: slideIn 0.5s ease-out;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(50px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Icon */
            .icon-circle {
                width: 100px;
                height: 100px;
                background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.05));
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 0 auto 25px;
                border: 2px solid rgba(34, 197, 94, 0.5);
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
                }
                70% {
                    box-shadow: 0 0 0 15px rgba(34, 197, 94, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
                }
            }

            .icon-circle i {
                font-size: 50px;
                color: #22c55e;
            }

            /* Title */
            h1 {
                font-size: 2rem;
                color: #22c55e;
                margin-bottom: 15px;
                font-weight: 700;
            }

            /* Message */
            .message {
                color: #cbd5e1;
                font-size: 1rem;
                line-height: 1.6;
                margin-bottom: 30px;
            }

            /* Button */
            .btn {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                background: linear-gradient(135deg, #22c55e, #16a34a);
                color: white;
                text-decoration: none;
                padding: 12px 32px;
                border-radius: 12px;
                font-weight: 600;
                font-size: 1rem;
                transition: all 0.3s ease;
                border: none;
                cursor: pointer;
            }

            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
            }

            .btn-secondary {
                background: rgba(255, 255, 255, 0.1);
                margin-left: 15px;
            }

            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.2);
                box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
            }

            .buttons {
                display: flex;
                gap: 15px;
                justify-content: center;
                flex-wrap: wrap;
            }

            /* Countdown */
            .countdown {
                margin-top: 25px;
                color: #64748b;
                font-size: 0.85rem;
            }

            .countdown span {
                color: #22c55e;
                font-weight: bold;
                font-size: 1.1rem;
            }
        </style>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <div class="success-card">
            <div class="icon-circle">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1>Success!</h1>
            <div class="message">
                The plan has been successfully updated in the database.<br>
                All changes have been saved.
            </div>
            <div class="buttons">
                <a href="/Billing-System-Web-GUI/OpenPlansPageServelt" class="btn">
                    <i class="fas fa-layer-group"></i> View All Plans
                </a>
                <a href="/Billing-System-Web-GUI/HTML/dashboard.html" class="btn btn-secondary">
                    <i class="fas fa-home"></i> Dashboard
                </a>
            </div>
        </div>
    </body>
</html>
