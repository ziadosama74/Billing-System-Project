<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Success - Plan Created</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                min-height: 100vh;
                background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow-x: hidden;
            }

            /* Animated background */
            body::before {
                content: "";
                position: fixed;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle, rgba(34, 197, 94, 0.15), transparent 60%);
                animation: moveBg 15s linear infinite;
                z-index: -1;
                top: -25%;
                left: -25%;
            }

            @keyframes moveBg {
                0% {
                    transform: translate(0, 0);
                }
                50% {
                    transform: translate(-25%, -25%);
                }
                100% {
                    transform: translate(0, 0);
                }
            }

            /* Success Card */
            .success-card {
                background: rgba(15, 23, 42, 0.85);
                backdrop-filter: blur(20px);
                border-radius: 28px;
                padding: 50px 40px;
                text-align: center;
                max-width: 550px;
                width: 90%;
                border: 1px solid rgba(34, 197, 94, 0.4);
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(34, 197, 94, 0.2);
                animation: slideIn 0.5s ease-out;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(50px) scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            /* Icon */
            .icon-circle {
                width: 110px;
                height: 110px;
                background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.05));
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 0 auto 25px;
                border: 2px solid rgba(34, 197, 94, 0.6);
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% {
                    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
                }
                70% {
                    box-shadow: 0 0 0 15px rgba(34, 197, 94, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
                }
            }

            .icon-circle i {
                font-size: 55px;
                color: #22c55e;
            }

            /* Title */
            h1 {
                font-size: 2.2rem;
                color: #22c55e;
                margin-bottom: 15px;
                font-weight: 800;
            }

            /* Message */
            .message {
                color: #cbd5e1;
                font-size: 1rem;
                line-height: 1.6;
                margin-bottom: 20px;
            }

            /* Plan Details Box */
            .plan-details {
                background: rgba(0, 0, 0, 0.3);
                border-radius: 16px;
                padding: 20px;
                margin: 20px 0;
                text-align: left;
                border: 1px solid rgba(34, 197, 94, 0.2);
            }

            .plan-details h3 {
                color: #22c55e;
                font-size: 1.1rem;
                margin-bottom: 15px;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .detail-row {
                display: flex;
                justify-content: space-between;
                padding: 8px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .detail-label {
                color: #94a3b8;
                font-weight: 500;
            }

            .detail-value {
                color: white;
                font-weight: 600;
            }

            .detail-value i {
                margin-right: 5px;
            }

            .plan-id {
                background: linear-gradient(135deg, #22c55e20, #16a34a10);
                border-radius: 10px;
                padding: 10px;
                margin-top: 15px;
                text-align: center;
                border: 1px solid #22c55e30;
            }

            .plan-id span {
                color: #22c55e;
                font-size: 1.3rem;
                font-weight: bold;
            }

            /* Buttons */
            .buttons {
                display: flex;
                gap: 15px;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 10px;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                color: white;
                text-decoration: none;
                padding: 12px 28px;
                border-radius: 12px;
                font-weight: 600;
                font-size: 0.95rem;
                transition: all 0.3s ease;
            }

            .btn-primary {
                background: linear-gradient(135deg, #22c55e, #16a34a);
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
            }

            .btn-secondary {
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.2);
                transform: translateY(-2px);
            }

            /* Countdown */
            .countdown {
                margin-top: 25px;
                color: #64748b;
                font-size: 0.85rem;
            }

            .countdown span {
                color: #22c55e;
                font-weight: bold;
                font-size: 1rem;
            }

            /* Responsive */
            @media (max-width: 600px) {
                .success-card {
                    padding: 35px 25px;
                }

                h1 {
                    font-size: 1.8rem;
                }

                .icon-circle {
                    width: 80px;
                    height: 80px;
                }

                .icon-circle i {
                    font-size: 40px;
                }

                .btn {
                    padding: 10px 20px;
                    font-size: 0.85rem;
                }
            }
        </style>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <div class="success-card">
            <div class="icon-circle">
                <i class="fas fa-check-circle"></i>
            </div>

            <h1>Plan Created Successfully!</h1>

            <div class="message">
                Your new plan has been added to the system. All allowances and free units have been configured.
            </div>
            <div class="buttons">
                <a href="/Billing-System-Web-GUI/OpenPlansPageServelt" class="btn btn-primary">
                    <i class="fas fa-layer-group"></i> View All Plans
                </a>
                <a href="/Billing-System-Web-GUI/HTML/dashboard.html" class="btn btn-secondary">
                    <i class="fas fa-home"></i> Dashboard
                </a>
            </div>
        </div>
    </body>
</html>
