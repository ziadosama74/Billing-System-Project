<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Update Failed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background glow */
        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.15), transparent 60%);
            animation: moveBg 15s linear infinite;
            z-index: -1;
            top: -25%;
            left: -25%;
        }

        @keyframes moveBg {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-25%, -25%); }
            100% { transform: translate(0, 0); }
        }

        /* Error Card */
        .error-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(239, 68, 68, 0.2);
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        /* Icon */
        .icon-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.05));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            border: 2px solid rgba(239, 68, 68, 0.5);
            animation: shakeIcon 0.5s ease-out 0.3s;
        }

        @keyframes shakeIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .icon-circle i {
            font-size: 50px;
            color: #ef4444;
        }

        /* Title */
        h1 {
            font-size: 2rem;
            color: #ef4444;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Message */
        .message {
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .error-details {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: left;
        }

        .error-details p {
            color: #f87171;
            font-size: 0.85rem;
            margin: 5px 0;
        }

        .error-details i {
            margin-right: 8px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            margin-left: 15px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Try again link */
        .try-again {
            margin-top: 25px;
        }

        .try-again a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .try-again a:hover {
            color: #38bdf8;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="error-card">
        <div class="icon-circle">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1>Update Failed!</h1>
        <div class="message">
            Something went wrong while updating the plan.<br>
            The changes could not be saved to the database.
        </div>
        <div class="error-details">
            <p><i class="fas fa-database"></i> Database connection issue</p>
            <p><i class="fas fa-search"></i> Plan ID may not exist</p>
            <p><i class="fas fa-check-circle"></i> Please verify the plan information and try again</p>
        </div>
        <div class="buttons">
            <a href="/Billing-System-Web-GUI/OpenPlansPageServelt" class="btn">
                <i class="fas fa-arrow-left"></i> Go Back & Try Again
            </a>
        </div>
        <div class="try-again">
            <a href="/Billing-System-Web-GUI/HTML/dashboard.html">
                <i class="fas fa-home"></i> Go to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
