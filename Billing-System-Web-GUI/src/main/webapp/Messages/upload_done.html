<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Upload Success</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI', sans-serif;
            }

            body {
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
                overflow: hidden;
                color: white;
            }

            /* animated glow */
            body::before {
                content: "";
                position: absolute;
                width: 200%;
                height: 200%;
                background: radial-gradient(circle at center, rgba(56,189,248,0.18), transparent 60%);
                animation: floatBg 12s ease-in-out infinite;
                z-index: 0;
            }

            @keyframes floatBg {
                0% {
                    transform: translate(0,0);
                }
                50% {
                    transform: translate(-10%, -10%);
                }
                100% {
                    transform: translate(0,0);
                }
            }

            /* main card */
            .card {
                position: relative;
                z-index: 1;
                width: 420px;
                padding: 40px;
                border-radius: 18px;
                background: rgba(255,255,255,0.06);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(56,189,248,0.25);
                box-shadow: 0 0 35px rgba(56,189,248,0.15);
                text-align: center;
                animation: pop 0.6s ease;
            }

            @keyframes pop {
                from {
                    transform: scale(0.9);
                    opacity: 0;
                }
                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            .icon {
                width: 70px;
                height: 70px;
                margin: 0 auto 15px;
                border-radius: 50%;
                background: rgba(34,197,94,0.15);
                display: flex;
                justify-content: center;
                align-items: center;
                color: #22c55e;
                font-size: 32px;
            }

            h1 {
                color: #38bdf8;
                font-size: 24px;
                margin-bottom: 10px;
            }

            p {
                color: #cbd5e1;
                font-size: 14px;
                margin-bottom: 25px;
            }

            .btn {
                display: inline-block;
                padding: 10px 18px;
                border-radius: 10px;
                background: #38bdf8;
                color: #0f172a;
                text-decoration: none;
                font-weight: bold;
                transition: 0.3s;
            }

            .btn:hover {
                background: #0ea5e9;
                transform: translateY(-2px);
            }
        </style>
    </head>

    <body>

        <div class="card">
            <div class="icon">✓</div>
            <h1>Upload Successful</h1>
            <p>Your CDR file has been uploaded and stored successfully in the system.</p>

            <a class="btn" href="/Billing-System-Web-GUI/HTML/CDR.html">
                Back to Upload
            </a>
        </div>

    </body>
</html>
